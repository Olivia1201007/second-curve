name: Release Android, Windows and macOS
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: android
      - run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > second-curve-android-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            second-curve-android-debug.apk.sha256
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build
      - shell: pwsh
        run: Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Get-FileHash -Algorithm SHA256 | Format-List | Out-File windows-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            windows-sha256.txt
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust targets for a universal macOS app
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: npm run tauri:build -- --target universal-apple-darwin --bundles dmg
      - name: Prepare macOS release assets
        run: |
          dmg_path=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg_path"
          cp "$dmg_path" "$GITHUB_WORKSPACE/second-curve-macos-universal.dmg"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 second-curve-macos-universal.dmg > macos-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            second-curve-macos-universal.dmg
            macos-sha256.txt
  publish:
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
