services:
  - type: web
    name: second-curve
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -B -m unittest -q test_server.py
    startCommand: python -B server.py
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: APP_ACCESS_USERNAME
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
